name: Deploy Refreeg v2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_recovery_emails:
        description: >-
          Send the "your campaign was recovered" notice (scripts/send-recovery-emails.ts)
          to unclaimed reconstructed causes' recovered_owner_email after this deploy.
          Off by default so ordinary push-to-main deploys never send anything — only
          check this on the specific manual run where you also want the recovery
          notice to go out (e.g. alongside setting SESSIONS_INVALIDATED_AFTER).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Test & lint gate ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:no-coverage

  # ── Build & deploy ────────────────────────────────────────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Build (on the generous GitHub runner, not on your small EC2) ───
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      # ── 2b. SSH Agent + known_hosts (needed early now — the migration step
      # below tunnels through SSH) ────────────────────────────────────────────
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      # ── 2c. Apply pending database migrations ──────────────────────────────
      # Schema changes were previously applied by hand (or sometimes not at
      # all — see the 2026-08-12 `payment_provider` incident, where a schema
      # field shipped with no migration and no automated apply step, and
      # silently broke prisma.donation.findMany() in production). Running
      # `migrate deploy` here means every push to main keeps the DB in sync
      # with prisma/migrations automatically, before the new code that
      # depends on the new schema ever goes live.
      #
      # This runner can't reach the DB directly (confirmed via a P1001
      # "can't reach database server" trying DATABASE_URL as-is) — it's not
      # publicly exposed, and it's a separate host from EC2_HOST, not
      # Postgres running locally on the app box. But the app box itself
      # clearly *can* reach it (same VPC / security-group allowlist, since
      # the app connects to it in production), so proxy the migration
      # through an SSH tunnel via that box instead of assuming anything
      # about where the DB actually lives — parse the real host/port
      # straight out of the DATABASE_URL secret at runtime.
      - name: Apply database migrations
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ec2-user
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DB_HOST=$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")
          DB_PORT=$(node -e "const u=new URL(process.env.DATABASE_URL); console.log(u.port || 5432)")

          ssh -f -N -L "15432:${DB_HOST}:${DB_PORT}" ${{ env.SSH_USER }}@${{ env.EC2_HOST }}

          TUNNELED_URL=$(node -e "
            const u = new URL(process.env.DATABASE_URL);
            u.hostname = '127.0.0.1';
            u.port = '15432';
            console.log(u.toString());
          ")
          DATABASE_URL="$TUNNELED_URL" pnpm exec prisma migrate deploy

          pkill -f "15432:${DB_HOST}:${DB_PORT}" 2>/dev/null || true

      # NEXT_PUBLIC_* vars are inlined into the compiled bundle at build time
      # (Next.js statically replaces every `process.env.NEXT_PUBLIC_X`
      # reference, in both client and server code, with a literal value
      # during `next build`) — they are NOT read from the runtime
      # environment. Having them only in secrets.env (below, written after
      # this step) does nothing for these; whatever value is missing here
      # gets permanently baked in as the code's `|| fallback`. This is what
      # caused the service-fee-always-0 bug: NEXT_PUBLIC_REFREEG_SERVICE_FEE
      # was only ever set at runtime, never at build time.
      - name: Build application
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_REFREEG_SERVICE_FEE: ${{ secrets.NEXT_PUBLIC_REFREEG_SERVICE_FEE }}
          NEXT_PUBLIC_BREET_ENV: ${{ secrets.NEXT_PUBLIC_BREET_ENV }}
          NEXT_PUBLIC_BREET_WEBHOOK_SECRET: ${{ secrets.NEXT_PUBLIC_BREET_WEBHOOK_SECRET }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_S3_DIRECT_UPLOAD: ${{ secrets.NEXT_PUBLIC_S3_DIRECT_UPLOAD }}
          NEXT_PUBLIC_PAYSTACK_PLAN_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PLAN_ID_MONTHLY }}
          NEXT_PUBLIC_PAYSTACK_PLAN_ID_WEEKLY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PLAN_ID_WEEKLY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          # SENTRY_ORG/PROJECT/AUTH_TOKEN are build-time-only — consumed by
          # the Sentry webpack plugin to upload source maps and associate a
          # release, never read by the running app. Deliberately NOT written
          # to secrets.env below; no reason to ship an org-write-scoped auth
          # token to the production server.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run build

      # ── 3. Package the minimal artifact ────────────────────────────────────
      # `output: "standalone"` (next.config.mjs) already traces only the
      # dependencies actually used at runtime into .next/standalone/node_modules
      # — no need to ship the full node_modules or run `pnpm prune` anymore.
      # public/ and .next/static are excluded from standalone by default and
      # must be copied in manually per Next.js docs.
      - name: Create deployment tarball
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp ecosystem.config.js .next/standalone/ecosystem.config.js

          # `sharp`'s dependency tree is NOT nested inside node_modules/sharp
          # under pnpm — pnpm gives every package its own isolated
          # node_modules/ folder (e.g. detect-libc/color/semver live as
          # SIBLINGS of sharp inside .pnpm/sharp@X/node_modules/, and color's
          # own deps live inside .pnpm/color@Y/node_modules/, and so on).
          # A plain `cp -rL node_modules/sharp` (tried previously) only
          # copies sharp's own folder and misses this entire sibling chain,
          # which is why "Cannot find module 'detect-libc'" persisted even
          # after that fix shipped. Walk the real resolution chain — each
          # package's own isolated folder, not a version-hardcoded guess —
          # and copy every real (dereferenced) target directly.
          STANDALONE_NM=".next/standalone/node_modules"
          rm -rf "$STANDALONE_NM"/sharp "$STANDALONE_NM"/detect-libc "$STANDALONE_NM"/semver \
                 "$STANDALONE_NM"/color "$STANDALONE_NM"/color-convert "$STANDALONE_NM"/color-string \
                 "$STANDALONE_NM"/color-name "$STANDALONE_NM"/simple-swizzle "$STANDALONE_NM"/is-arrayish \
                 "$STANDALONE_NM"/@img
          mkdir -p "$STANDALONE_NM/@img"

          SHARP_DIR=$(dirname "$(readlink -f node_modules/sharp)")
          COLOR_DIR=$(dirname "$(readlink -f "$SHARP_DIR/color")")
          COLOR_STRING_DIR=$(dirname "$(readlink -f "$COLOR_DIR/color-string")")
          SWIZZLE_DIR=$(dirname "$(readlink -f "$COLOR_STRING_DIR/simple-swizzle")")

          for pkg in sharp color detect-libc semver; do
            cp -rL "$SHARP_DIR/$pkg" "$STANDALONE_NM/$pkg"
          done
          # Only the linux-arm64 binaries (the actual deploy target) — the
          # other ~11 platform variants pnpm linked here (from
          # supportedArchitectures, kept broad for local dev on other OSes)
          # would just be dead weight on a disk-constrained EC2 instance.
          cp -rL "$SHARP_DIR/@img/sharp-linux-arm64" "$STANDALONE_NM/@img/sharp-linux-arm64"
          cp -rL "$SHARP_DIR/@img/sharp-libvips-linux-arm64" "$STANDALONE_NM/@img/sharp-libvips-linux-arm64"

          cp -rL "$COLOR_DIR/color-convert" "$STANDALONE_NM/color-convert"
          cp -rL "$COLOR_DIR/color-string" "$STANDALONE_NM/color-string"
          cp -rL "$COLOR_STRING_DIR/color-name" "$STANDALONE_NM/color-name"
          cp -rL "$COLOR_STRING_DIR/simple-swizzle" "$STANDALONE_NM/simple-swizzle"
          cp -rL "$SWIZZLE_DIR/is-arrayish" "$STANDALONE_NM/is-arrayish"

          TARBALL="deploy-${{ github.sha }}.tar.gz"
          tar -czf "$TARBALL" -C .next/standalone .
          echo "Tarball size: $(du -sh "$TARBALL" | cut -f1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      # ── 5. Generate secrets.env from GitHub Secrets (never committed) ─────
      - name: Create secrets env file
        env:
          DIDIT_WEBHOOK_SECRET: ${{ secrets.DIDIT_WEBHOOK_SECRET }}
          DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
          DIDIT_CLIENT_SECRET: ${{ secrets.DIDIT_CLIENT_SECRET }}
          DIDIT_CLIENT_ID: ${{ secrets.DIDIT_CLIENT_ID }}
          NEXT_PUBLIC_BREET_ENV: ${{ secrets.NEXT_PUBLIC_BREET_ENV }}
          NEXT_PUBLIC_BREET_WEBHOOK_SECRET: ${{ secrets.NEXT_PUBLIC_BREET_WEBHOOK_SECRET }}
          BREET_APP_SECRET: ${{ secrets.BREET_APP_SECRET }}
          BREET_APP_ID: ${{ secrets.BREET_APP_ID }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SESSIONS_INVALIDATED_AFTER: ${{ secrets.SESSIONS_INVALIDATED_AFTER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          CONVERTKIT_API_KEY: ${{ secrets.CONVERTKIT_API_KEY }}
          CONVERTKIT_FORM_ID: ${{ secrets.CONVERTKIT_FORM_ID }}
          CONVERTKIT_API_SECRET: ${{ secrets.CONVERTKIT_API_SECRET }}
          NEXT_PUBLIC_REFREEG_SERVICE_FEE: ${{ secrets.NEXT_PUBLIC_REFREEG_SERVICE_FEE }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          FLUTTERWAVE_WEBHOOK_HASH: ${{ secrets.FLUTTERWAVE_WEBHOOK_HASH }}
          FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
          FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_S3_DIRECT_UPLOAD: ${{ secrets.NEXT_PUBLIC_S3_DIRECT_UPLOAD }}
          NEXT_PUBLIC_PAYSTACK_PLAN_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PLAN_ID_MONTHLY }}
          NEXT_PUBLIC_PAYSTACK_PLAN_ID_WEEKLY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PLAN_ID_WEEKLY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cat > secrets.env <<EOF
          DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET}
          DIDIT_WORKFLOW_ID=${DIDIT_WORKFLOW_ID}
          DIDIT_CLIENT_SECRET=${DIDIT_CLIENT_SECRET}
          DIDIT_CLIENT_ID=${DIDIT_CLIENT_ID}
          NEXT_PUBLIC_BREET_ENV=${NEXT_PUBLIC_BREET_ENV}
          NEXT_PUBLIC_BREET_WEBHOOK_SECRET=${NEXT_PUBLIC_BREET_WEBHOOK_SECRET}
          BREET_APP_SECRET=${BREET_APP_SECRET}
          BREET_APP_ID=${BREET_APP_ID}
          AWS_S3_BUCKET=${AWS_S3_BUCKET}
          AWS_REGION=${AWS_REGION}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
          AUTH_URL=${AUTH_URL}
          AUTH_SECRET=${AUTH_SECRET}
          SESSIONS_INVALIDATED_AFTER=${SESSIONS_INVALIDATED_AFTER}
          DATABASE_URL=${DATABASE_URL}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          EMAIL_FROM=${EMAIL_FROM}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${SMTP_USER}
          CONVERTKIT_API_KEY=${CONVERTKIT_API_KEY}
          CONVERTKIT_FORM_ID=${CONVERTKIT_FORM_ID}
          CONVERTKIT_API_SECRET=${CONVERTKIT_API_SECRET}
          NEXT_PUBLIC_REFREEG_SERVICE_FEE=${NEXT_PUBLIC_REFREEG_SERVICE_FEE}
          PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
          HEALTH_CHECK_TOKEN=${HEALTH_CHECK_TOKEN}
          FLUTTERWAVE_WEBHOOK_HASH=${FLUTTERWAVE_WEBHOOK_HASH}
          FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY}
          FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
          NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
          NEXT_PUBLIC_S3_DIRECT_UPLOAD=${NEXT_PUBLIC_S3_DIRECT_UPLOAD}
          NEXT_PUBLIC_PAYSTACK_PLAN_ID_MONTHLY=${NEXT_PUBLIC_PAYSTACK_PLAN_ID_MONTHLY}
          NEXT_PUBLIC_PAYSTACK_PLAN_ID_WEEKLY=${NEXT_PUBLIC_PAYSTACK_PLAN_ID_WEEKLY}
          NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
          SENTRY_DSN=${SENTRY_DSN}
          NODE_ENV=production
          PORT=3000
          API_PORT=4000
          EOF
          chmod 600 secrets.env

      # ── 7. Transfer artifacts to EC2 ──────────────────────────────────────
      # (SSH agent + known_hosts were already set up in step 2b, before the
      # migration step, since that needed them too.)
      - name: Transfer artifacts to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ec2-user
          APP_DIR: /mnt/data/refreeg
        run: |
          # Ensure APP_DIR exists and is owned by ec2-user (idempotent — relies on
          # ec2-user having passwordless sudo, the AWS EC2 default). scp writes as
          # ec2-user directly and cannot elevate mid-transfer, so ownership must be
          # fixed here, before any scp/tar happens.
          ssh ${{ env.SSH_USER }}@${{ env.EC2_HOST }} \
            "sudo mkdir -p ${{ env.APP_DIR }} && \
             sudo chown ${{ env.SSH_USER }}:${{ env.SSH_USER }} ${{ env.APP_DIR }} && \
             mkdir -p ${{ env.APP_DIR }}/releases ${{ env.APP_DIR }}/shared/logs"

          # Transfer the build tarball, secrets file, and both scripts.
          # ecosystem.config.js is already baked into the tarball root, no
          # need to ship it separately.
          scp \
            "$TARBALL" \
            secrets.env \
            ./scripts/remote-deploy.sh \
            ./scripts/rollback.sh \
            ${{ env.SSH_USER }}@${{ env.EC2_HOST }}:${{ env.APP_DIR }}/

      # ── 8. Run remote deploy script on EC2 ────────────────────────────────
      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ec2-user
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.EC2_HOST }} \
            "RELEASE_ID='${{ github.sha }}' TARBALL='$TARBALL' bash /mnt/data/refreeg/remote-deploy.sh"

      # ── 9. Health check ───────────────────────────────────────────────────
      - name: Health check
        run: |
          echo "Waiting 15 seconds for PM2 processes to fully start..."
          sleep 30

          check() {
            url="$1"
            for attempt in 1 2 3; do
              status=$(curl -s -L -o /dev/null -w "%{http_code}" "$url" || echo "000")
              echo "Attempt $attempt — $url — HTTP $status"
              if [ "$status" -eq 200 ]; then
                echo "✅ $url passed."
                return 0
              fi
              echo "Retrying in 10 seconds..."
              sleep 10
            done
            echo "❌ $url failed after 3 attempts."
            return 1
          }

          check "https://refreeg.com/api/health" && frontend_ok=1 || frontend_ok=0
          check "https://apps.refreeg.com/api/health" && api_ok=1 || api_ok=0

          if [ "$frontend_ok" -eq 1 ] && [ "$api_ok" -eq 1 ]; then
            exit 0
          fi
          exit 1

      # ── 9b. Recovery emails (manual opt-in only, see workflow_dispatch input) ──
      - name: Send recovery emails
        if: github.event_name == 'workflow_dispatch' && inputs.send_recovery_emails == true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npx tsx scripts/send-recovery-emails.ts

      # ── 10. Status badge note ─────────────────────────────────────────────
      - name: Status badge
        if: always()
        run: |
          echo "Add this badge to your README.md:"
          echo "![Deploy](https://github.com/${{ github.repository }}/actions/workflows/deploy.yml/badge.svg)"

      # ── 11. Rollback on any failure ───────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ec2-user
        run: |
          echo "🔄 Deployment failed — triggering rollback..."
          # Re-seed known_hosts rather than trusting step 6's copy survived —
          # this step runs on `failure()`, so a health-check failure right
          # after the EC2 box restarted PM2 (SSH briefly unreachable, or the
          # instance rotated its host key) can leave it stale/missing, which
          # otherwise fails the one step meant to save a broken deploy.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh ${{ env.SSH_USER }}@${{ env.EC2_HOST }} \
            "bash /mnt/data/refreeg/rollback.sh"

      # ── 12. Cleanup local secrets ──────────────────────────────────────────
      - name: Remove local secrets file
        if: always()
        run: rm -f secrets.env
