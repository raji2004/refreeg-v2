<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="font-family: sans-serif; background: #f8fafc; padding: 20px">
    <div
      style="
        max-width: 600px;
        margin: auto;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
      "
    >
      <div
        style="
          background: #1e3a8a;
          padding: 24px;
          text-align: center;
          color: white;
        "
      >
        <h2 style="margin: 0">New proof of impact</h2>
      </div>
      <div style="padding: 32px; color: #334155; line-height: 1.6">
        <p>
          The organizer of <strong>"{{causeTitle}}"</strong> just posted a
          verified fund-use update.
        </p>
        <p>See exactly how your support is being put to work.</p>
        <a
          href="{{causeUrl}}"
          style="
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
          "
          >See the update</a
        >
      </div>
    </div>
  </body>
</html>
