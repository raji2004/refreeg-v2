<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="font-family: sans-serif; background: #f8fafc; padding: 20px">
    <div
      style="
        max-width: 600px;
        margin: auto;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
      "
    >
      <div
        style="
          background: #b45309;
          padding: 24px;
          text-align: center;
          color: white;
        "
      >
        <h2 style="margin: 0">Your update needs changes</h2>
      </div>
      <div style="padding: 32px; color: #334155; line-height: 1.6">
        <p>Hi <strong>{{userName}}</strong>,</p>
        <p>
          Our team reviewed your update for
          <strong>"{{causeTitle}}"</strong> and couldn't approve it as-is.
        </p>
        <div
          style="
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 16px;
            border-radius: 8px;
            margin: 24px 0;
          "
        >
          <p style="margin: 0"><strong>Reason:</strong> {{rejectionReason}}</p>
        </div>
        <p>
          Please submit a revised update. If your campaign is paused, it will go
          live again as soon as an update is approved.
        </p>
        <a
          href="{{dashboardUrl}}"
          style="
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
          "
          >Submit revision</a
        >
      </div>
    </div>
  </body>
</html>
