<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a">
    <div style="max-width:600px;margin:0 auto;padding:40px 20px">
      <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:36px">
        <p style="margin:0 0 12px;color:#2563eb;font-weight:700">RefreeG organization invitation</p>
        <h1 style="margin:0 0 18px;font-size:26px">Join {{organizationName}}</h1>
        <p style="margin:0 0 12px;line-height:1.6">
          {{inviterName}} invited you to join <strong>{{organizationName}}</strong>
          as {{role}}.
        </p>
        <p style="margin:0 0 24px;line-height:1.6">This invitation expires in 7 days.</p>
        <a href="{{invitationUrl}}" style="display:inline-block;background:#002b5b;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:700">
          Accept invitation
        </a>
        <p style="margin:28px 0 0;color:#64748b;font-size:13px;line-height:1.5">
          If you were not expecting this invitation, you can ignore this email.
        </p>
      </div>
      <p style="text-align:center;color:#94a3b8;font-size:12px">© {{currentYear}} RefreeG</p>
    </div>
  </body>
</html>
