user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # Bare apex domain redirects to www — it must never reach the Next.js
    # app directly. Auth.js's cookies (__Host-/__Secure- prefixed) are
    # strictly host-only; a request answered as "refreeg.com" gets cookies
    # scoped to that exact host, invisible on www.refreeg.com and vice
    # versa, which breaks session/OAuth state. This used to proxy straight
    # to the app (same as www below) — that's exactly what caused it.
    # Certbot's managed SSL lines (reusing www.refreeg.com's cert) live on
    # the actual server config; omitted here since this repo copy predates
    # Certbot's edits to the other blocks too.
    server {
        listen 80;
        server_name refreeg.com;
        return 301 https://www.refreeg.com$request_uri;
    }

    # Both hostnames proxy to the same single Next.js process (see
    # ecosystem.config.js) — middleware.ts's domain-split logic decides which
    # routes are canonical on which hostname purely from the Host header
    # passed through below, not by routing to a different backend.
    server {
        listen 80;
        server_name www.refreeg.com;
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 80;
        server_name apps.refreeg.com;
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
